name: Update lazyaws

# Polls the lazyaws releases, so the tap needs no token from another repository.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-lazyaws
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: capybara-brain346/lazyaws
  FORMULA_FILE: Formula/lazyaws.rb

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      changed: ${{ steps.release.outputs.changed }}
      matrix: ${{ steps.formula.outputs.matrix }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # actions/checkout v4.2.1
      - id: release
        name: Compare the latest release with the formula
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's latest release is the newest published stable release.
          tag="$(gh release view --repo "$SOURCE_REPOSITORY" --json tagName,isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "The latest release tag is invalid: $tag" >&2
            exit 1
          }

          current="$(grep -o -m 1 'releases/download/v[0-9][0-9.]*' "$FORMULA_FILE" | sed 's|.*/v||')"
          newest="$(printf '%s\n' "$current" "${tag#v}" | sort -V | tail -n 1)"
          if [[ "$current" == "${tag#v}" || "$newest" != "${tag#v}" ]]; then
            echo "The formula has $current; the latest release is $tag. Nothing to do."
            changed=false
          else
            echo "The formula has $current; updating to $tag."
            changed=true
          fi
          printf 'tag=%s\nchanged=%s\n' "$tag" "$changed" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.release.outputs.changed == 'true'
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # actions/checkout v4.2.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ steps.release.outputs.tag }}
          path: source
          persist-credentials: false
      - id: formula
        if: steps.release.outputs.changed == 'true'
        name: Generate the formula from the verified release
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$SOURCE_REPOSITORY" --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum --check SHA256SUMS)
          node source/scripts/generate-packages.mjs "$RUNNER_TEMP/release/SHA256SUMS" "$RUNNER_TEMP/packages"
          cp "$RUNNER_TEMP/packages/homebrew/$FORMULA_FILE" "$FORMULA_FILE"
          matrix="$(node -e 'console.log(JSON.stringify(require("./source/distribution/config.json").targets))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
      - if: steps.release.outputs.changed == 'true'
        name: Commit and push the formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA_FILE"
          git commit --quiet \
            --message "feat(lazyaws): update formula to ${TAG#v}" \
            --message "Generated by the update-lazyaws workflow from the verified $TAG SHA256SUMS." \
            --message "Release: $GITHUB_SERVER_URL/$SOURCE_REPOSITORY/releases/tag/$TAG"
          git push --quiet origin HEAD
        env:
          TAG: ${{ steps.release.outputs.tag }}

  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.update.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # actions/checkout v4.2.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ needs.update.outputs.tag }}
          persist-credentials: false
      - name: Install and test the formula
        run: scripts/check-homebrew.sh capybara-brain346/tap/lazyaws lazyaws "$TAG"
        env:
          TAG: ${{ needs.update.outputs.tag }}
